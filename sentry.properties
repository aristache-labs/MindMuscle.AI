# Debug Information Files Configuration
# For more information, visit: https://docs.sentry.io/platforms/react-native/data-management/debug-files/

# === SOURCE MAPS CONFIGURATION ===
# Upload source maps automatically for JavaScript/TypeScript
upload.sourcemaps=true
sourcemap.rewrite=true
sourcemap.stripPrefix=true
sourcemap.stripCommonPrefix=true
sourcemap.validate=true
sourcemap.url-prefix=~/

# === DEBUG SYMBOLS CONFIGURATION ===
# Upload debug symbols for native crashes (iOS dSYM, Android symbols)
upload.symbols=true
symbols.upload=true
symbols.include-sources=true
symbols.validate=true

# iOS specific - dSYM files
ios.upload-dsym=true
ios.dsym-path=ios/build/Build/Products/Release-iphoneos/

# Android specific - ProGuard mappings and native symbols
android.upload-proguard=true
android.upload-native-symbols=true
android.proguard-path=android/app/build/outputs/mapping/release/

# === RELEASE MANAGEMENT ===
upload.release=true
release.finalize=true
release.deploy=true
release.set-commits=auto
release.new=true

# === SOURCE CONTEXT ===
# Include source context in stack traces
upload.sources=true
sources.include-paths=app/,components/,services/,hooks/,utils/,types/,constants/
sources.exclude-paths=node_modules/,dist/,build/,.expo/

# === BUILD PROCESS INTEGRATION ===
upload.auto=true
upload.wait-for-processing=true
upload.max-wait=300

# === FILE HANDLING ===
# File size limits (in MB)
max-file-size=40
max-archive-size=100

# Compression
upload.compress=true

# === LOGGING AND DEBUGGING ===
log.level=info
log.file=sentry-upload.log

# === NETWORK CONFIGURATION ===
# Timeout settings (in seconds)
http.timeout=30
http.keepalive=true
http.connect-timeout=10

# Retry configuration
http.retries=3
http.retry-delay=1

# === VALIDATION ===
# Validate uploads
validate.sourcemaps=true
validate.symbols=true

# === IGNORE CONFIGURATION ===
ignore-file=.sentryignore

# === PLATFORM SPECIFIC SETTINGS ===
# React Native Metro bundler integration
react-native.bundle-id-template={{bundle_id}}
react-native.sourcemap-output={{sourcemap_output}}

# === ADVANCED OPTIONS ===
# Strip debug information from uploaded files
strip.enabled=true
strip.crash-reports=false

# Deduplicate identical files
dedupe.enabled=true

# === ENVIRONMENT SPECIFIC ===
# Different settings for different environments
[environment:development]
upload.auto=false
log.level=debug

[environment:staging]
upload.auto=true
log.level=info

[environment:production]
upload.auto=true
log.level=warn
upload.wait-for-processing=true 